<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Lista de Contactos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/dom.js" defer></script>
</head>

<body>
  <div class="main-container">
    <div class="contacto-input">
      <h2>Datos del Contacto</h2>
      <div class="contacto-form">
        <form>
          <label for="nombre">Nombre</label><input type="text" id="nombre">
          <label for="direccion">Dirección</label><input type="text" id="direccion">
          <label for="telefono">Teléfono</label><input type="text" id="telefono">
        </form>

        <!-- mensage -->
        <span class="mensageAccion"></span>

        <div class="input-btns">
          <button type="submit" id="submit-btn"><span><i class="fas fa-plus"></i></span>Contacto</button>
          <button type="button" id="cancel-btn"><span><i class="fas fa-times"></i></span>Cancelar</button>
        </div>
      </div>
    </div>

    <div class="contacto-display">
      <h2>Lista de Contactos</h2>
      <button type="button" id="reset-btn">Vaciar</button>
      <div class="contactos-container">
        <!-- tempate-item -->
      </div>
    </div>
  </div>

  <template id="template-item">
    <div class="contacto-item">
      <div class="contacto-el">
        <span id="etiqueta">Nombre: </span>
        <span id="nombre-content"></span>
      </div>

      <div class="contacto-el">
        <span id="etiqueta">Direccion: </span>
        <span id="direccion-content"></span>
      </div>

      <div class="contacto-el">
        <span id="etiqueta">Teléfono: </span>
        <span id="telefono-content"></span>
      </div>

      <button type="button" class="change-btn"><span><i class="fas fa-redo"></i></span> Modificar</button>
      <button type="button" class="delete-btn"><span><i class="fas fa-trash"></i></span> Borrar</button>
    </div>
  </template>
</body>

</html>
